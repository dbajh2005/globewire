# GitHub pauses scheduled workflows in a public repository after 60 days without a commit.
# Once a month this records a one-line heartbeat commit (only when nothing else was committed
# in the last 25 days), so the news keeps updating on its own.
# Commits made with the built-in token don't start another news build.
name: Keep the schedule alive

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:        # "Run workflow" records a heartbeat right away, as a test

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record a heartbeat if the repository has been quiet
        run: |
          last=$(git log -1 --format=%ct)
          quiet_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was $quiet_days day(s) ago."
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$quiet_days" -lt 25 ]; then
            echo "Recent activity found; no heartbeat needed."
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "Heartbeat: keep the news schedule running"
          git push
